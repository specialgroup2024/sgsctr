services:
  db:
    image: postgres:18-alpine
    container_name: sgsctr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgsctr_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sgsctr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sgsctr_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Optional host proxy settings are passed only to the image build.
      # Empty/unset host variables do not add proxy configuration.
      args:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
        http_proxy:
        https_proxy:
        no_proxy:
    container_name: sgsctr-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrations: "true"
      Authentication__Enabled: ${AUTHENTICATION_ENABLED:-false}
      Organization__ManagerSubjects: ${ORGANIZATION_MANAGER_SUBJECTS:-}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-specialgroup2024@gmail.com}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DataProtection__KeysDirectory: /var/lib/sgsctr/data-protection-keys
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-sgsctr_dev};Username=${POSTGRES_USER:-sgsctr};Password=${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    volumes:
      - sgsctr_dataprotection_keys:/var/lib/sgsctr/data-protection-keys
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sgsctr-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTHENTICATION_ENABLED: ${AUTHENTICATION_ENABLED:-false}
      API_BASE_URL: http://api:8080
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Set AUTH_SESSION_SECRET in your local .env file}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      # Publish only the web UI to the host/LAN. Keep API, PostgreSQL and pgAdmin loopback-only.
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgsctr-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-specialgroup2024@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:5051:80"
    volumes:
      - sgsctr_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  sgsctr_postgres_data:
  sgsctr_pgadmin_data:
  sgsctr_dataprotection_keys:
    name: sgsctr_dataprotection_keys
