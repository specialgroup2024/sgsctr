services:
  db:
    image: postgres:18-alpine
    container_name: sgsctr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgsctr_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sgsctr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5433:5432"
    volumes:
      - sgsctr_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: sgsctr-keycloak
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in your local .env file}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in your local .env file}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - sgsctr_keycloak_data:/opt/keycloak/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgsctr-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-sgsctr_dev};Username=${POSTGRES_USER:-sgsctr};Password=${POSTGRES_PASSWORD:-local_dev_only_change_me}
      Authentication__Authority: http://localhost:8180/realms/sgsctr
      Authentication__MetadataAddress: http://keycloak:8080/realms/sgsctr/.well-known/openid-configuration
      Authentication__Audience: sgsctr-api
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sgsctr-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgsctr-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-specialgroup2024@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:5051:80"
    volumes:
      - sgsctr_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  sgsctr_postgres_data:
  sgsctr_pgadmin_data:
  sgsctr_keycloak_data:
