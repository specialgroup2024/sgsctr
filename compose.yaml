services:
  db:
    image: postgres:18-alpine
    container_name: sgsctr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgsctr_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sgsctr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5433:5432"
    volumes:
      - sgsctr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgsctr -d sgsctr_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgsctr-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-sgsctr_dev};Username=${POSTGRES_USER:-sgsctr};Password=${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  sgsctr_postgres_data:
