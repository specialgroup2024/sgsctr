name: .NET and web foundation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [master, feature/native-identity-authentication, fix/identity-runtime-model-parity-v2, fix/appdbcontext-model-parity-probe-ci, feat/eda-regulatory-ingestion, feat/complete-bilingual-rtl-coverage]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bilingual translation keys
        run: cd web && npm run check:i18n
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Restore
        run: dotnet restore Sgsctr.slnx
      - name: Build
        run: dotnet build Sgsctr.slnx --configuration Release --no-restore
      - name: Run automated tests
        run: dotnet test Sgsctr.slnx --configuration Release --no-build

      - name: Validate EF Core migration snapshots
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Capture AppDbContext model/snapshot difference
        continue-on-error: true
        run: |
          snapshot="src/Sgsctr.Api/Data/Migrations/AppDbContextModelSnapshot.cs"
          cp "$snapshot" /tmp/AppDbContextModelSnapshot.before.cs
          set +e
          dotnet ef migrations add AppDbContextModelParityProbe --context AppDbContext --project src/Sgsctr.Api --startup-project src/Sgsctr.Api --configuration Release --no-build --output-dir Data/ModelParityProbe > /tmp/appdb-model-parity-probe.log 2>&1
          probe_status=$?
          set -e
          echo "EF probe exit code: $probe_status"
          cat /tmp/appdb-model-parity-probe.log
          git diff -- "$snapshot" > /tmp/appdb-model-snapshot.diff
          if [ -f src/Sgsctr.Api/Data/ModelParityProbe/*_AppDbContextModelParityProbe.cs ]; then
            cat src/Sgsctr.Api/Data/ModelParityProbe/*_AppDbContextModelParityProbe.cs
          else
            echo "No probe migration file was generated."
          fi
          cp /tmp/AppDbContextModelSnapshot.before.cs "$snapshot"
      - name: Upload AppDbContext model/snapshot diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appdbcontext-model-parity-diagnostic
          path: |
            /tmp/appdb-model-parity-probe.log
            /tmp/appdb-model-snapshot.diff
            src/Sgsctr.Api/Data/ModelParityProbe/*.cs
          if-no-files-found: warn
      - name: Validate EF Core migration snapshots
        run: |
          dotnet ef migrations has-pending-model-changes --context AuthDbContext --project src/Sgsctr.Api --startup-project src/Sgsctr.Api --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes --context AppDbContext --project src/Sgsctr.Api --startup-project src/Sgsctr.Api --configuration Release --no-build
      - name: Start API, PostgreSQL and Next.js
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
          AUTH_SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          WEB_BASE_URL: http://localhost:3000
          AUTHENTICATION_ENABLED: "true"
          COOKIE_SECURE: "false"
        run: docker compose up --build --detach
      - name: Install Playwright browser for responsive RTL checks
        run: |
          cd web
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify bilingual RTL layout on desktop and mobile
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
        run: cd web && node rtl-smoke.mjs
      - name: Upload RTL visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-rtl-visual-evidence
          path: web/artifacts/rtl-*.png
          if-no-files-found: ignore
      - name: API, database and web smoke tests
        env:
          VERIFY_DOCKER_DATABASE: "true"
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
          AUTH_SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          WEB_BASE_URL: http://localhost:3000
          AUTHENTICATION_ENABLED: "true"
          COOKIE_SECURE: "false"
        run: bash scripts/smoke-test.sh http://127.0.0.1:8080 http://127.0.0.1:3000
      - name: Install Playwright Chromium for responsive RTL checks
        run: |
          cd web
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify English and Arabic layouts on desktop and mobile
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          WEB_BASE_URL: http://127.0.0.1:3000
        run: cd web && node scripts/rtl-visual-check.mjs
      - name: Upload Arabic desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgsctr-arabic-rtl-screenshots
          path: web/artifacts/rtl-visual/
          if-no-files-found: ignore
      - name: Container diagnostics on failure
        if: failure()
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
          AUTH_SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          WEB_BASE_URL: http://localhost:3000
          AUTHENTICATION_ENABLED: "true"
          COOKIE_SECURE: "false"
        run: |
          docker compose ps -a
          docker compose logs --tail=200 api db web
      - name: Stop local stack without deleting data volumes
        if: always()
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
          AUTH_SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          WEB_BASE_URL: http://localhost:3000
          AUTHENTICATION_ENABLED: "true"
          COOKIE_SECURE: "false"
        run: docker compose down


  appdbcontext-model-parity-diagnostic:
    name: Diagnose AppDbContext runtime model vs migration snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Restore and build API
        run: |
          dotnet restore src/Sgsctr.Api/Sgsctr.Api.csproj
          dotnet build src/Sgsctr.Api/Sgsctr.Api.csproj --configuration Release --no-restore
      - name: Scaffold diagnostic migration and preserve exact model diff
        shell: bash
        run: |
          set -uo pipefail
          snapshot="src/Sgsctr.Api/Data/Migrations/AppDbContextModelSnapshot.cs"
          backup="/tmp/AppDbContextModelSnapshot.before.cs"
          report="/tmp/appdbcontext-model-parity-report.txt"
          cp "$snapshot" "$backup"
          restore_snapshot() { cp "$backup" "$snapshot"; }
          trap restore_snapshot EXIT

          dotnet tool install --global dotnet-ef --version 10.0.4
          export PATH="$PATH:$HOME/.dotnet/tools"

          set +e
          dotnet ef migrations add AppDbContextModelParityProbe \
            --context AppDbContext \
            --project src/Sgsctr.Api \
            --startup-project src/Sgsctr.Api \
            --configuration Release \
            --no-build \
            --output-dir Data/ModelParityProbe \
            > /tmp/appdbcontext-model-parity-scaffold.log 2>&1
          probe_status=$?
          set -e

          {
            echo "EF scaffold exit code: $probe_status"
            echo
            cat /tmp/appdbcontext-model-parity-scaffold.log
            echo
            echo "=== Snapshot delta (committed snapshot -> generated runtime snapshot) ==="
            git diff --no-index -- "$backup" "$snapshot" || true
            echo
            echo "=== Generated migration files ==="
            find src/Sgsctr.Api/Data/ModelParityProbe -maxdepth 1 -type f -name '*.cs' -print 2>/dev/null || true
            while IFS= read -r file; do
              echo
              echo "=== $file ==="
              cat "$file"
            done < <(find src/Sgsctr.Api/Data/ModelParityProbe -maxdepth 1 -type f -name '*.cs' -print 2>/dev/null | sort)
          } > "$report"

          cat "$report"
          exit 0
      - name: Upload exact AppDbContext parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appdbcontext-model-parity-evidence
          path: |
            /tmp/appdbcontext-model-parity-report.txt
            /tmp/appdbcontext-model-parity-scaffold.log
          if-no-files-found: warn
