name: .NET and web foundation
on:
  push:
    branches: [master, phase-1-local-foundation, phase-2-nextjs-ui]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Restore
        run: dotnet restore Sgsctr.slnx
      - name: Build
        run: dotnet build Sgsctr.slnx --configuration Release --no-restore
      - name: Start API, PostgreSQL and Next.js
        run: docker compose up --build --detach
      - name: API, database and web smoke tests
        run: bash scripts/smoke-test.sh http://localhost:8080 http://localhost:3000
      - name: Container logs on failure
        if: failure()
        run: docker compose logs api db web
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
