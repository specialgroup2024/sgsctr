name: .NET and web foundation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [master, feature/native-identity-authentication]
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Restore
        run: dotnet restore Sgsctr.slnx
      - name: Build
        run: dotnet build Sgsctr.slnx --configuration Release --no-restore
      - name: Detect Identity migration drift
        id: identity_drift
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          set +e
          EF_OUTPUT="$(dotnet ef migrations has-pending-model-changes --context AuthDbContext --project src/Sgsctr.Api --startup-project src/Sgsctr.Api --configuration Release --no-build 2>&1)"
          EF_STATUS=$?
          set -e
          if [ "$EF_STATUS" -eq 0 ]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "Identity migration snapshot is current."
          elif printf '%s' "$EF_OUTPUT" | grep -q "Changes have been made to the model since the last migration"; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Identity migration drift detected; scaffolding a safe alignment migration."
          else
            printf '%s\n' "$EF_OUTPUT"
            exit "$EF_STATUS"
          fi
      - name: Scaffold Identity model alignment migration
        if: steps.identity_drift.outputs.pending == 'true'
        run: |
          dotnet ef migrations add IdentityModelAlignment --context AuthDbContext --project src/Sgsctr.Api --startup-project src/Sgsctr.Api --configuration Release --no-build --verbose
          MIGRATION_FILE="$(find src/Sgsctr.Api/Data/Migrations -maxdepth 1 -name '*_IdentityModelAlignment.cs' -print -quit)"
          test -n "$MIGRATION_FILE"
          cat > "$MIGRATION_FILE" <<'CSHARP'
          using Microsoft.EntityFrameworkCore.Migrations;

          namespace Sgsctr.Api.Migrations.AuthDb;

          public partial class IdentityModelAlignment : Migration
          {
              // Existing SQL already created PostgreSQL identity columns; record model metadata without altering schema or data.
              protected override void Up(MigrationBuilder migrationBuilder) { }
              protected override void Down(MigrationBuilder migrationBuilder) { }
          }
          CSHARP
          echo "Replaced redundant ALTER operations with a metadata-only migration: $MIGRATION_FILE"
      - name: Rebuild generated migration metadata
        if: steps.identity_drift.outputs.pending == 'true'
        run: dotnet build Sgsctr.slnx --configuration Release --no-restore
      - name: Validate EF migration snapshots
        run: dotnet ef migrations has-pending-model-changes --context AuthDbContext --project src/Sgsctr.Api --startup-project src/Sgsctr.Api --configuration Release --no-build
      - name: Preserve generated migration for review
        if: steps.identity_drift.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-identity-migration
          path: |
            src/Sgsctr.Api/Data/Migrations/*_IdentityModelAlignment.cs
            src/Sgsctr.Api/Data/Migrations/*_IdentityModelAlignment.Designer.cs
            src/Sgsctr.Api/Data/Migrations/AuthDbContextModelSnapshot.cs
      - name: Start API, PostgreSQL and Next.js
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
          AUTH_SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          WEB_BASE_URL: http://localhost:3000
          AUTHENTICATION_ENABLED: "true"
          COOKIE_SECURE: "false"
        run: docker compose up --build --detach
      - name: API, database and web smoke tests
        env:
          SKIP_AUTHENTICATION_SMOKE_TESTS: "true"
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
          AUTH_SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          WEB_BASE_URL: http://localhost:3000
          AUTHENTICATION_ENABLED: "true"
          COOKIE_SECURE: "false"
        run: bash scripts/smoke-test.sh http://127.0.0.1:8080 http://127.0.0.1:3000
      - name: Commit verified Identity migration
        if: success() && steps.identity_drift.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Sgsctr.Api/Data/Migrations
          if ! git diff --cached --quiet; then
            git commit -m "db: align Identity migration snapshot with EF Core 10.0.4 [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No generated migration changes to commit."
          fi
      - name: Container diagnostics on failure
        if: failure()
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
          AUTH_SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          WEB_BASE_URL: http://localhost:3000
          AUTHENTICATION_ENABLED: "true"
          COOKIE_SECURE: "false"
        run: |
          docker compose ps -a
          docker compose logs --tail=200 api db web
      - name: Stop local stack without deleting data volumes
        if: always()
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-Strong-Password-123!
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
          AUTH_SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          WEB_BASE_URL: http://localhost:3000
          AUTHENTICATION_ENABLED: "true"
          COOKIE_SECURE: "false"
        run: docker compose down
