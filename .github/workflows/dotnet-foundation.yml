name: .NET and web foundation
on:
  push:
    branches: [master, phase-1-local-foundation, phase-2-nextjs-ui, phase-1-keycloak-authentication, phase-2-application-shell]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Restore
        run: dotnet restore Sgsctr.slnx
      - name: Build
        run: dotnet build Sgsctr.slnx --configuration Release --no-restore
      - name: Start API, PostgreSQL, Keycloak and Next.js
        env:
          KEYCLOAK_ADMIN_USERNAME: admin
          KEYCLOAK_ADMIN_PASSWORD: ci-only-local-development-password
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
        run: docker compose up --build --detach
      - name: API, database, Keycloak and web smoke tests
        env:
          KEYCLOAK_ADMIN_USERNAME: admin
          KEYCLOAK_ADMIN_PASSWORD: ci-only-local-development-password
          PGADMIN_DEFAULT_PASSWORD: ci-only-local-development-password
        run: bash scripts/smoke-test.sh http://localhost:8080 http://localhost:3000 http://localhost:8180
      - name: Container logs on failure
        if: failure()
        run: docker compose logs api db keycloak web
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
