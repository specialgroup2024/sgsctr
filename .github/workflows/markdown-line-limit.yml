name: Documentation limits and integrity

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  documentation-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Markdown files are below 200 lines
        run: python scripts/check_markdown_line_limit.py
      - name: Check generated AI context catalogue
        run: python scripts/ai_context_index.py --check
      - name: Check repository-relative Markdown links
        run: python scripts/check_markdown_links.py
